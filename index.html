<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG touch icons; it needs a real 180px PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No maximum-scale: it blocks pinch-zoom on Android (iOS has ignored it
         since iOS 10), which is a WCAG 1.4.4 failure, and nothing in the layout
         needs zoom suppressed to hold together. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14694e" />
    <link rel="preload" href="/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Press" />
    <meta
      name="description"
      content="Track golf side games: match play, skins, Stableford, Wolf and more."
    />
    <title>Press — Golf Side Games</title>
    <style>
      /* Splash shown until React mounts (avoids a white flash on load).
         It is a SIBLING of #root, not a child: as a child, createRoot().render()
         deleted it the instant React mounted and the deep green cut to the app
         background in a single frame. Outside #root it survives the mount, so
         main.tsx can fade it over the app's own screen-in slide and the two read
         as one entrance instead of a cut followed by an animation. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(160deg, #14694e, #0b3d2e);
        color: #f4f7f2;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      }
      #splash .mark {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        display: flex;
        /* Mark bottom sits on the text baseline so it reads as the P. */
        align-items: baseline;
        gap: 5px;
      }
      #splash .mark svg {
        width: 39px;
        height: 45px;
      }
      #splash .sub {
        font-size: 0.9rem;
        opacity: 0.8;
      }
      /* main.tsx adds .done after mount and removes the node when the fade
         ends. Slightly longer than the app's 0.24s screen-in so the felt is
         still receding as the first screen finishes arriving. Reduced motion
         never gets here — main.tsx removes the node outright instead. */
      #splash.done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <div class="mark" role="img" aria-label="Press">
        <!-- P Flag mark stands in for the P (splash already is the felt). -->
        <svg viewBox="100 64 336 384" aria-hidden="true">
          <path d="M154 84 C270 90 352 116 404 162 Q420 178 404 194 C352 240 270 266 154 272 Z" fill="#e7b53c" />
          <rect x="118" y="84" width="36" height="344" rx="18" fill="#f4f7f2" />
          <circle cx="268" cy="178" r="58" fill="#f4f7f2" />
          <circle cx="268" cy="178" r="49" fill="none" stroke="#14694e" stroke-width="16" stroke-dasharray="18 20.5" stroke-dashoffset="9" transform="rotate(-90 268 178)" />
        </svg>
        <span aria-hidden="true">ress</span>
      </div>
      <div class="sub">Golf side games</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
