<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG touch icons; it needs a real 180px PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No maximum-scale: it blocks pinch-zoom on Android (iOS has ignored it
         since iOS 10), which is a WCAG 1.4.4 failure, and nothing in the layout
         needs zoom suppressed to hold together. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14694e" />
    <link rel="preload" href="/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trunk" />
    <meta
      name="description"
      content="Settle golf side games at the trunk: match play, skins, Nassau, Wolf and more. Nobody plays for free."
    />
    <title>Trunk — Golf Side Games</title>
    <link rel="canonical" href="https://pressgolf.netlify.app/" />
    <!-- Link unfurls. A shared round link is how Trunk mostly spreads, and
         without these it lands in a group chat as a bare URL. The card is
         public/og.png, drawn by scripts/og-image.mjs (npm run og:image). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trunk" />
    <meta property="og:url" content="https://pressgolf.netlify.app/" />
    <meta property="og:title" content="Trunk — Golf Side Games" />
    <meta property="og:description" content="Trunk is a mobile-first web app for golf side games. One scorekeeper enters scores for the whole group on a single phone, and Trunk does the math — live leaderboards and running money totals while you play, then the fewest payments to settle it at the trunk." />
    <meta property="og:image" content="https://pressgolf.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trunk — golf side games. Settle it at the trunk." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trunk — Golf Side Games" />
    <meta name="twitter:description" content="Trunk is a mobile-first web app for golf side games. One scorekeeper enters scores for the whole group on a single phone, and Trunk does the math — live leaderboards and running money totals while you play, then the fewest payments to settle it at the trunk." />
    <meta name="twitter:image" content="https://pressgolf.netlify.app/og.png" />
    <style>
      /* Splash shown until React mounts (avoids a white flash on load).
         It is a SIBLING of #root, not a child: as a child, createRoot().render()
         deleted it the instant React mounted and the deep green cut to the app
         background in a single frame. Outside #root it survives the mount, so
         main.tsx can fade it over the app's own screen-in slide and the two read
         as one entrance instead of a cut followed by an animation. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(160deg, #14694e, #0b3d2e);
        color: #f4f7f2;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      }
      /* The wordmark in the app's own face — the woff2 is preloaded above, so
         this costs nothing the stylesheet was not already going to pay. */
      @font-face {
        font-family: 'Oswald';
        font-style: normal;
        font-weight: 500 600;
        font-display: swap;
        src: url('/fonts/oswald-latin.woff2') format('woff2');
      }
      #splash .mark {
        font-family: Oswald, 'Arial Narrow', sans-serif;
        font-size: 3rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        display: flex;
        /* The mark stands in for the U: bottom edge on the baseline, stems to
           the cap line (0.8125em), with the U's side bearings — the same
           sizing as .logo in the Home header. */
        align-items: baseline;
        gap: 0;
      }
      #splash .mark svg {
        height: 1.04em;
        width: 0.73125em;
        margin: 0 0.107em 0 0.047em;
      }
      #splash .sub {
        font-size: 0.9rem;
        opacity: 0.8;
      }
      /* With scripts off the splash never fades, so this is the page. */
      #splash noscript {
        max-width: 30ch;
        margin-top: 16px;
        text-align: center;
        font-size: 1rem;
        line-height: 1.4;
      }
      /* main.tsx adds .done after mount and removes the node when the fade
         ends. Slightly longer than the app's 0.24s screen-in so the felt is
         still receding as the first screen finishes arriving. Reduced motion
         never gets here — main.tsx removes the node outright instead. */
      #splash.done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <div class="mark" role="img" aria-label="Trunk">
        <span aria-hidden="true">TR</span>
        <!-- The Trunk mark stands in for the U (splash already is the felt).
             A static copy of src/trunkMark.ts at cap height 100; regenerate
             it from there if the geometry changes. -->
        <svg viewBox="0 -28 90 128" aria-hidden="true">
          <path d="M22 0 V55 A23 23 0 0 0 68 55 V0 Z" fill="#072a1f" />
          <path d="M11 0 V55 A34 34 0 0 0 79 55 V0" fill="none" stroke="#f4f7f2" stroke-width="22" />
          <g transform="rotate(-24 11 9.11)">
            <rect x="8.14" y="9.11" width="14.96" height="3.04" rx="1.52" fill="#072a1f" />
            <rect x="3.08" y="-1.01" width="76.16" height="10.12" rx="5.06" fill="#e7b53c" />
          </g>
          <circle cx="45" cy="53.62" r="18.4" fill="#f4f7f2" />
          <circle cx="45" cy="53.62" r="15.54" fill="none" stroke="#14694e" stroke-width="5.08" stroke-dasharray="5.71 6.5" stroke-dashoffset="2.86" transform="rotate(-90 45 53.62)" />
        </svg>
        <span aria-hidden="true">NK</span>
      </div>
      <div class="sub">Settle it at the trunk.</div>
      <noscript>
        Trunk needs JavaScript: it runs entirely in your browser, with no account and no
        server. Turn JavaScript on to score a round.
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
